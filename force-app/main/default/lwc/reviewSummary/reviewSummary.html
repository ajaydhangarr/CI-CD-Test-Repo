<template>
    <article class="slds-card review-summary-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span>{summaryTitle}</span>
                    </h2>
                </div>
            </header>
        </div>

        <div class="slds-card__body slds-card__body_inner">
            <template if:true={hasMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_warning" role="alert">
                    <span>{message}</span>
                </div>
            </template>

            <template if:false={hasMessage}>
                <dl class="slds-dl_horizontal review-summary-list">
                    <template for:each={displayItems} for:item="item">
                        <dt key={item.labelKey} class="slds-dl_horizontal__label">
                            {item.label}
                        </dt>
                        <dd key={item.valueKey} class="slds-dl_horizontal__detail">
                            {item.value}
                        </dd>
                    </template>
                </dl>
            </template>
        </div>
    </article>
</template>
