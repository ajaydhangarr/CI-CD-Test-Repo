<template>
    <!-- test comment -->
     <!-- test comment from testbranch -->
      <!-- test comment from testbranch1 -->
    <article class="slds-card dynamic-form-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <span>Dynamic Form</span>
                    </h2>
                </div>
            </header>
        </div>

        <div class="slds-card__body slds-card__body_inner">
            <template if:true={hasConfigurationMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_warning" role="alert">
                    <span>{configurationMessage}</span>
                </div>
            </template>

            <template if:false={hasConfigurationMessage}>
                <div class="slds-grid slds-wrap slds-gutters dynamic-form-grid">
                    <template for:each={visibleFieldList} for:item="field">
                        <div
                            key={field.name}
                            class="slds-col slds-size_1-of-1 slds-large-size_1-of-2 dynamic-form-field"
                        >
                            <div class={field.formElementClass}>
                                <label
                                    class="slds-form-element__label"
                                    for={field.inputId}
                                >
                                    <template if:true={field.required}>
                                        <abbr class="slds-required" title="required">*</abbr>
                                    </template>
                                    {field.label}
                                </label>

                                <div class="slds-form-element__control">
                                    <template if:true={field.isInput}>
                                        <lightning-input
                                            id={field.inputId}
                                            data-name={field.name}
                                            type={field.inputType}
                                            label={field.label}
                                            variant="label-hidden"
                                            value={field.value}
                                            placeholder={field.placeholder}
                                            required={field.required}
                                            aria-required={field.required}
                                            aria-describedby={field.ariaDescribedBy}
                                            onchange={handleInputChange}
                                        >
                                        </lightning-input>
                                    </template>

                                    <template if:true={field.isCheckbox}>
                                        <lightning-input
                                            id={field.inputId}
                                            data-name={field.name}
                                            type="checkbox"
                                            label={field.label}
                                            variant="label-hidden"
                                            checked={field.checked}
                                            required={field.required}
                                            aria-required={field.required}
                                            aria-describedby={field.ariaDescribedBy}
                                            onchange={handleCheckboxChange}
                                        >
                                        </lightning-input>
                                    </template>

                                    <template if:true={field.isTextarea}>
                                        <lightning-textarea
                                            id={field.inputId}
                                            data-name={field.name}
                                            label={field.label}
                                            variant="label-hidden"
                                            value={field.value}
                                            placeholder={field.placeholder}
                                            required={field.required}
                                            aria-required={field.required}
                                            aria-describedby={field.ariaDescribedBy}
                                            onchange={handleInputChange}
                                        >
                                        </lightning-textarea>
                                    </template>

                                    <template if:true={field.isPicklist}>
                                        <lightning-combobox
                                            id={field.inputId}
                                            data-name={field.name}
                                            label={field.label}
                                            variant="label-hidden"
                                            value={field.value}
                                            placeholder={field.placeholder}
                                            options={field.options}
                                            required={field.required}
                                            aria-required={field.required}
                                            aria-describedby={field.ariaDescribedBy}
                                            onchange={handlePicklistChange}
                                        >
                                        </lightning-combobox>
                                    </template>
                                </div>

                                <template if:true={field.showError}>
                                    <div
                                        id={field.errorId}
                                        class="slds-form-element__help dynamic-form-error"
                                        role="alert"
                                    >
                                        {field.error}
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </article>
</template>
